<svg xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" width="1000" height="248" viewBox="0 0 1000 248" role="img" aria-labelledby="title desc">
  <title id="title">Pattern 3: Local tool on a hybrid worker</title>
  <desc id="desc">Pattern 3, local tool on a hybrid worker. A Logic Apps workflow in Azure starts an Azure Automation runbook and polls the job with its managed identity. Two Windows hybrid runbook workers in the simulated datacenter, a peered VNet, pick up the job over outbound HTTPS with their managed identities and run a local conversion tool against the NAS as a local account. The datacenter servers are Azure Arc-enabled, which gives them their managed identities. The partners are not involved.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3d4466"/></marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#138a7a"/></marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1b1f3b" flood-opacity="0.12"/></filter>
  </defs>
  <style>
    text { fill: #1b1f3b; }
    .badge { font-size: 17px; font-weight: 700; fill: #ffffff; }
    .pattern { font-size: 20px; font-weight: 700; }
    .question { font-size: 14px; fill: #4a5072; font-style: italic; }
    .column { font-size: 14px; font-weight: 700; }
    .sub { font-size: 12px; fill: #4a5072; }
    .name { font-size: 14.5px; font-weight: 700; }
    .kind { font-size: 12.5px; fill: #4a5072; }
    .edge { font-size: 12px; fill: #3d4466; font-weight: 600; }
    .teal { font-size: 12px; fill: #138a7a; font-weight: 600; }
    .unused { font-size: 13px; fill: #9aa0b8; font-style: italic; }
  </style>
  <rect width="1000" height="248" rx="14" fill="#ffffff" stroke="#8a90ad" stroke-width="1.2"/>
  <circle cx="36" cy="36" r="16" fill="#1b1f3b"/>
  <text class="badge" x="36" y="42" text-anchor="middle">3</text>
  <text class="pattern" x="62" y="43">Local tool on a hybrid worker</text>
  <text class="question" x="20" y="72">Can Logic Apps run a local tool on a datacenter server, as a dedicated account, and see failures?</text>
  <rect x="16" y="88" width="228" height="144" rx="12" fill="#edf7ee" stroke="#2e7d32" stroke-width="1.8"/>
  <rect x="256" y="88" width="488" height="144" rx="12" fill="#eaf2fb" stroke="#0b5cad" stroke-width="1.8"/>
  <rect x="756" y="88" width="228" height="144" rx="12" fill="#fdf0e3" stroke="#c25e00" stroke-width="1.8"/>
  <text class="column" x="130.0" y="112" text-anchor="middle" style="fill:#2e7d32">Partners (simulated)</text>
  <text class="column" x="500.0" y="112" text-anchor="middle" style="fill:#0b5cad">Azure</text>
  <text class="column" x="870.0" y="112" text-anchor="middle" style="fill:#c25e00">Datacenter (Arc-enabled)</text>
  <text class="sub" x="130.0" y="130" text-anchor="middle">own VNet, not peered; public IP</text>
  <text class="sub" x="500.0" y="130" text-anchor="middle">public endpoints</text>
  <text class="sub" x="870.0" y="130" text-anchor="middle">simulated; peered, private IPs</text>
  <text class="unused" x="130.0" y="187" text-anchor="middle">not involved</text>
  <rect x="290" y="150" width="150" height="64" rx="10" fill="#ffffff" stroke="#0b5cad" stroke-width="2" filter="url(#shadow)"/>
  <text class="name" x="365.0" y="176" text-anchor="middle">Logic Apps</text>
  <text class="kind" x="365.0" y="196" text-anchor="middle">starts, polls a job</text>
  <rect x="530" y="150" width="130" height="64" rx="10" fill="#ffffff" stroke="#0b5cad" stroke-width="1.5" filter="url(#shadow)"/>
  <text class="name" x="595.0" y="176" text-anchor="middle">Automation</text>
  <text class="kind" x="595.0" y="196" text-anchor="middle">runbook</text>
  <rect x="800" y="150" width="160" height="64" rx="10" fill="#ffffff" stroke="#c25e00" stroke-width="1.5" filter="url(#shadow)"/>
  <text class="name" x="880.0" y="176" text-anchor="middle">Hybrid workers</text>
  <text class="kind" x="880.0" y="196" text-anchor="middle">Arc-enabled servers</text>
  <line x1="440" y1="182" x2="526" y2="182" stroke="#3d4466" stroke-width="2" marker-end="url(#arrow)"/>
  <text class="edge" x="485" y="158" text-anchor="middle">managed</text>
  <text class="edge" x="485" y="172" text-anchor="middle">identity</text>
  <line x1="800" y1="182" x2="664" y2="182" stroke="#138a7a" stroke-width="2" marker-end="url(#arrow-teal)"/>
  <text class="teal" x="732" y="158" text-anchor="middle">Arc managed</text>
  <text class="teal" x="732" y="172" text-anchor="middle">identity</text>
</svg>
