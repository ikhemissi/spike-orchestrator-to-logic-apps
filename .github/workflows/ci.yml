# The offline checks of scripts/check.sh on every push and pull request. No Azure access and no secrets.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.15.8"
          terraform_wrapper: false
      - name: PowerShell modules
        shell: pwsh
        # Retried: a download from the PowerShell Gallery occasionally arrives truncated.
        run: |
          foreach ($attempt in 1..3) {
            try {
              # Pinned so that CI is reproducible and new releases are adopted deliberately.
              Install-Module Pester -RequiredVersion 6.2.0 -Scope CurrentUser -Force -SkipPublisherCheck -ErrorAction Stop
              Install-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Scope CurrentUser -Force -ErrorAction Stop
              break
            }
            catch { if ($attempt -eq 3) { throw }; Write-Warning "Attempt $attempt failed: $_"; Start-Sleep -Seconds 10 }
          }
      - name: Checks
        run: scripts/check.sh
